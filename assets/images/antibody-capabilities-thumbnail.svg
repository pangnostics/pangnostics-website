<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Antibody analysis: four capabilities</title>
  <desc id="desc">Conceptual illustrations of individual antibodies, fluorescent labeling, antibody binding and an antibody aggregate. These symbols are schematic and do not represent measured data or molecular stoichiometry.</desc>
  <defs>
    <symbol id="antibody" viewBox="0 0 164.11 167.32">
