<path fill="#6aa8e7" d="M138.57,56.52l-13.13,15.33c-1.73,2.02-4.19,3.06-6.66,3.06-2.01,0-4.04-.69-5.69-2.1-3.67-3.14-4.09-8.68-.96-12.34l12.9-15.07c5.42,4.46,10.59,8.71,13.52,11.12Z"/>
<path fill="#e9a0ae" d="M142.82,14.44c1.36-1.58,2.1-3.61,2.1-5.69,0-2.56-1.12-4.99-3.06-6.65-3.67-3.14-9.2-2.71-12.34.96l-22.11,25.82,13.5,11.15,21.91-25.59Z"/>
<path fill="#6aa8e7" d="M106.43,30.03l-19.17,22.39c-.31.37-.6.76-.84,1.16l.09.03-.37,1.42-.05-.02v7.91s-8.09,0-8.09,0v-7.91s-.05.02-.05.02l-.34-1.43.06-.02c-.25-.41-.53-.8-.84-1.16l-19.17-22.39c-3.35,2.79-9.02,7.47-13.49,11.16l15.83,18.49h.03s.47,1.45.47,1.45v97.45c0,4.83,3.93,8.75,8.75,8.75,4.83,0,8.75-3.93,8.75-8.75v-90.28s8.09,0,8.09,0v90.28c0,4.83,3.93,8.75,8.75,8.75,4.83,0,8.75-3.93,8.75-8.75V61.05s-.03-.01-.03-.01l.49-1.38.05.02,15.83-18.49c-4.47-3.68-10.15-8.37-13.49-11.16ZM86.1,66.39h-8.09s0-1.56,0-1.56h8.09s0,1.56,0,1.56Z"/>
<path fill="#e9a0ae" d="M43.19,40.03l13.5-11.15L34.58,3.06C32.92,1.11,30.49,0,27.92,0c-2.08,0-4.1.75-5.69,2.1-1.94,1.66-3.06,4.09-3.06,6.65,0,2.08.75,4.1,2.1,5.69l21.91,25.59Z"/>
<path fill="#6aa8e7" d="M39.05,45.4c-5.48,4.51-10.61,8.73-13.52,11.12l13.13,15.33c3.14,3.67,8.68,4.1,12.34.96,3.67-3.14,4.09-8.68.96-12.34l-12.9-15.07Z"/>
<path fill="#e9a0ae" d="M15.4,17.77c-1.52-1.78-3.64-2.85-5.97-3.03-.23-.02-.46-.03-.69-.03-2.08,0-4.09.75-5.68,2.1C1.12,18.48,0,20.91,0,23.47c0,2.08.75,4.1,2.1,5.69l22.47,26.24,13.5-11.15L15.4,17.77Z"/>
    </symbol>
  </defs>
  <rect width="960" height="540" fill="#0b2241"/>
  <!-- Concentration: separated molecules, without invented axes or values. -->
  <g>
    <use href="#antibody" x="129" y="64" width="53" height="54"/>
    <use href="#antibody" x="214" y="64" width="53" height="54"/>
    <use href="#antibody" x="299" y="64" width="53" height="54"/>
    <use href="#antibody" x="129" y="140" width="53" height="54"/>
    <use href="#antibody" x="214" y="140" width="53" height="54"/>
    <use href="#antibody" x="299" y="140" width="53" height="54"/>
  </g>
  <!-- Degree of labeling: distinct conjugated dye symbols, not binding-site labels. -->
  <use href="#antibody" x="660" y="62" width="120" height="122"/>
  <g fill="#f3bd59" stroke="#0b2241" stroke-width="4">
    <circle cx="689" cy="109" r="10"/>
    <circle cx="752" cy="115" r="10"/>
    <circle cx="730" cy="163" r="10"/>
  </g>
  <!-- Binding affinity: an antibody with a simple target at one binding tip. -->
  <use href="#antibody" x="180" y="327" width="120" height="122"/>
  <path d="M193 319 206 310 220 317 219 332 206 340 193 332Z" fill="#a8c9ea" stroke="#d9eafa" stroke-width="2"/>
  <!-- Aggregate detection: a compact group, distinct from the separated molecules above. -->
  <g transform="translate(654 330) rotate(-25 45 46)"><use href="#antibody" width="90" height="92"/></g>
  <g transform="translate(704 325) rotate(27 45 46)"><use href="#antibody" width="90" height="92"/></g>
  <g transform="translate(682 365) rotate(178 45 46)"><use href="#antibody" width="90" height="92"/></g>
  <g fill="#eef5fd" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" text-anchor="middle">
    <text x="240" y="236">Concentration</text>
    <text x="720" y="236">Degree of labeling</text>
    <text x="240" y="492">Binding affinity</text>
    <text x="720" y="492">Aggregate detection</text>
  </g>
</svg>
